<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Mẫu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // To prevent FOUC (Flash of Unstyled Content) or flash of wrong theme
    // This runs before React and sets the initial theme class
    (function() {
      try {
        var theme = localStorage.getItem('theme');
        // Default to light mode unless 'dark' is explicitly set in localStorage
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (_) {}
    })();
  </script>
  <style>
    /* Custom Dark Theme Background */
    .dark body {
      background-color: #0B0B3B;
    }
      
    /* For custom scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9; /* slate-100 */
    }
    .dark ::-webkit-scrollbar-track {
        background: #1e293b; /* slate-800 */
    }
    ::-webkit-scrollbar-thumb {
      background: #94a3b8; /* slate-400 */
      border-radius: 4px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #475569; /* slate-600 */
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b; /* slate-500 */
    }
    .dark ::-webkit-scrollbar-thumb:hover {
      background: #64748b; /* slate-500 */
    }


    /* Custom Animations */
    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scale-in {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fade-in {
      animation: fade-in 0.2s ease-out forwards;
    }
    .animate-scale-in {
      animation: scale-in 0.2s ease-out forwards;
    }
  </style>
